name: Build Release APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter config --jdk-dir=$JAVA_HOME
      - name: Cache Pub and Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-flutter-gradle-${{ hashFiles('pubspec.yaml', 'android/build.gradle*', 'android/app/build.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-flutter-gradle-
      - name: Configure Gradle Maven Central Mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/maven-mirror.init.gradle.kts
          import org.gradle.api.artifacts.dsl.RepositoryHandler
          import org.gradle.api.artifacts.repositories.MavenArtifactRepository

          fun RepositoryHandler.injectMavenCentralMirror() {
              val mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2/"
              if (none { it is MavenArtifactRepository && it.url.toString() == mirrorUrl }) {
                  val mirror = maven {
                      name = "GoogleMavenCentralMirror"
                      url = uri(mirrorUrl)
                  }
                  val mavenCentralIndex = indexOfFirst {
                      it is MavenArtifactRepository && it.url.toString().contains("repo.maven.apache.org")
                  }
                  if (mavenCentralIndex >= 0) {
                      remove(mirror)
                      add(mavenCentralIndex, mirror)
                  }
              }
          }

          gradle.settingsEvaluated {
              pluginManagement.repositories.injectMavenCentralMirror()
              dependencyResolutionManagement.repositories.injectMavenCentralMirror()
          }

          gradle.allprojects {
              buildscript.repositories.injectMavenCentralMirror()
              repositories.injectMavenCentralMirror()
          }
          EOF
      - name: Prepare Android NDK & Project Config
        run: |
          # Detect pre-installed NDK on ubuntu-latest runner (avoids 1.5GB network download & zip corruption)
          INSTALLED_NDK=$(ls -1 "$ANDROID_HOME/ndk" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$INSTALLED_NDK" ]; then
            INSTALLED_NDK="28.2.13676358"
            for attempt in 1 2 3; do
              rm -rf "$ANDROID_HOME/ndk/$INSTALLED_NDK" "$ANDROID_HOME/.temp"
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
              if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$INSTALLED_NDK"; then
                break
              fi
              sleep 5
            done
          fi
          echo "Using Android NDK: $INSTALLED_NDK"

          rm -f pubspec.lock
          rm -f android/settings.gradle android/settings.gradle.kts
          rm -f android/build.gradle android/build.gradle.kts
          rm -f android/app/build.gradle android/app/build.gradle.kts
          rm -f android/gradle/wrapper/gradle-wrapper.properties
          flutter create . --platforms=android

          sed -i 's/namespace = ".*"/namespace = "com.universal.filetransfer"/' android/app/build.gradle.kts
          sed -i 's/applicationId = ".*"/applicationId = "com.universal.filetransfer"/' android/app/build.gradle.kts
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/targetSdk = .*/targetSdk = 36/' android/app/build.gradle.kts
          sed -i 's/minSdk = .*/minSdk = 24/' android/app/build.gradle.kts
          sed -i "s/ndkVersion = .*/ndkVersion = \"$INSTALLED_NDK\"/" android/app/build.gradle.kts

          cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              pluginManager.withPlugin("com.android.library") {
                  extensions.configure<com.android.build.api.variant.LibraryAndroidComponentsExtension>("androidComponents") {
                      finalizeDsl { extension ->
                          extension.compileSdk = 36
                          extension.ndkVersion = "$INSTALLED_NDK"
                      }
                  }
              }
          }
          EOF
          sed -i "s/\$INSTALLED_NDK/$INSTALLED_NDK/g" android/build.gradle.kts

          FLUTTER_SDK=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: universal-file-transfer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
