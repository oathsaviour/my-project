name: Build Release APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter config --jdk-dir=$JAVA_HOME
      - run: |
          rm -f android/settings.gradle android/settings.gradle.kts
          rm -f android/build.gradle android/build.gradle.kts
          rm -f android/app/build.gradle android/app/build.gradle.kts
          rm -f android/gradle/wrapper/gradle-wrapper.properties
          flutter create . --platforms=android
          sed -i 's/namespace = ".*"/namespace = "com.universal.filetransfer"/' android/app/build.gradle.kts
          sed -i 's/applicationId = ".*"/applicationId = "com.universal.filetransfer"/' android/app/build.gradle.kts
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/minSdk = .*/minSdk = 24/' android/app/build.gradle.kts
          echo -e '\nsubprojects {\n    afterEvaluate {\n        project ->\n            if (project.hasProperty("android")) {\n                project.android {\n                    if (namespace == null) {\n                        namespace project.group\n                    }\n                    lintOptions {\n                        checkReleaseBuilds false\n                        abortOnError false\n                    }\n                }\n            }\n    }\n}' >> android/build.gradle.kts
          FLUTTER_SDK=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: universal-file-transfer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
